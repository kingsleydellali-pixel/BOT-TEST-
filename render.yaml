services:
  - type: web
    name: gothic-md
    env: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: PORT
        value: 3000
      - key: SESSION_ID
        sync: false          # ← paste the GOTHIC MD SITE session id in the Render dashboard
